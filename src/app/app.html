<div class="min-h-screen bg-[#090312] text-[#f3e8ff] flex flex-col relative selection:bg-purple-600 selection:text-white">
  <!-- Fixed Navbar -->
  <app-navbar></app-navbar>

  <!-- Hero Section -->
  <app-hero></app-hero>

  <!-- Sales Gallery (CSS Grid) with Categories & Search -->
  <app-gallery></app-gallery>

  <!-- Drag & Drop Admin Upload Interactive Banner Section -->
  <section class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
    <div class="drag-drop-zone rounded-3xl p-8 sm:p-14 text-center relative overflow-hidden bg-gradient-to-r from-purple-950/40 via-[#1c0c38]/50 to-purple-950/40 border-2 border-dashed border-purple-500/40 shadow-xl shadow-purple-950/50">
      
      <!-- Ambient Glow Decorator -->
      <div class="absolute -top-12 -left-12 w-48 h-48 bg-purple-600/15 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-12 -right-12 w-48 h-48 bg-fuchsia-600/15 rounded-full blur-3xl pointer-events-none"></div>

      <div class="max-w-2xl mx-auto space-y-4 relative z-10">
        <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-purple-900/60 text-purple-200 text-xs font-semibold uppercase tracking-wider border border-purple-500/30 backdrop-blur-md">
          <span class="w-2 h-2 rounded-full bg-fuchsia-400 animate-pulse"></span>
          Área de Creadores & Administración
        </div>
        
        <h3 class="font-display font-bold text-2xl sm:text-4xl text-white tracking-tight">
          Publica Nuevas Obras en el Catálogo
        </h3>
        
        <p class="text-purple-200/70 text-sm sm:text-base leading-relaxed font-light">
          Sube tus fotografías de paisajes o de producto en alta resolución. Establece el precio, detalles de edición y publícalas al instante con arrastrar y soltar.
        </p>
        
        <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-4">
          <button
            (click)="shop.openUploadModal()"
            class="btn-neon-violet px-8 py-3.5 rounded-2xl text-sm font-bold inline-flex items-center gap-2.5 shadow-lg group">
            <svg class="w-5 h-5 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
              <path d="M12 12v9"/>
              <path d="m16 16-4-4-4 4"/>
            </svg>
            <span>Lanzar Simulador Drag & Drop</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <app-footer></app-footer>

  <!-- Interactive Overlays / Modals / Slide-over Drawer -->
  <app-upload-panel></app-upload-panel>
  <app-cart-drawer></app-cart-drawer>
  <app-photo-modal></app-photo-modal>
</div>
